name: Temporary npm security audit

on:
  push:
    branches:
      - security/npm-audit-remediation

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Apply compatible npm audit fixes
        run: npm audit fix --ignore-scripts
      - name: Audit after remediation
        run: npm audit --json > npm-audit-after.json || true
      - name: Commit remediation
        run: |
          rm -f npm-audit-after.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No dependency changes were produced."
          else
            git add package.json package-lock.json
            git commit -m "fix(security): remediate npm audit vulnerabilities"
            git push
          fi
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-after
          path: npm-audit-after.json
          if-no-files-found: ignore
